<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Stratford — Agent Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0b0d;--panel:#15151a;--panel2:#1b1b21;--line:#262630;--line2:#30303a;--gold:#c9a24b;--gold-soft:#d8bd7a;--txt:#f1efe9;--muted:#8f8a80;--green:#5fcf8e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:40px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{padding:22px 0 16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:700}.brand .d{color:var(--gold)}
.sub{color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:1.5px;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--green);font-weight:500}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 12px;text-align:center}
.sc .v{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;line-height:1}
.sc .v.g{color:var(--gold-soft)}
.sc .l{color:var(--muted);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;margin-top:6px}
.sech{font-family:'Cormorant Garamond',serif;font-size:18px;margin:4px 0 14px;display:flex;align-items:center;gap:10px}
.sech .bar{width:22px;height:2px;background:var(--gold)}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:11px;cursor:pointer;transition:border-color .2s}
.agent:hover{border-color:var(--line2)}
.atop{display:flex;align-items:center;gap:13px}
.ico{flex:none;width:44px;height:44px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:21px}
.ainfo{flex:1;min-width:0}
.aname{font-size:15px;font-weight:600}
.arole{color:var(--muted);font-size:12px;margin-top:1px}
.badge{font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:6px;font-weight:600;white-space:nowrap;color:var(--green);background:rgba(95,207,142,.1);border:1px solid rgba(95,207,142,.25)}
.atask{margin-top:13px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:12.5px;color:var(--gold-soft);line-height:1.4}
.adetail{max-height:0;overflow:hidden;transition:max-height .3s ease}
.agent.open .adetail{max-height:440px}
.adetail-inner{padding-top:13px;margin-top:13px;border-top:1px solid var(--line)}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid #1c1c22}
.stat-row:last-child{border-bottom:none}
.stat-row .k{color:var(--muted)}.stat-row .val{color:var(--txt);font-weight:500}
.log{margin-top:12px}
.logitem{font-size:11.5px;color:var(--muted);padding:5px 0 5px 15px;position:relative;line-height:1.5}
.logitem::before{content:"";position:absolute;left:2px;top:10px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.tap{text-align:center;color:var(--muted);font-size:10px;margin-top:11px;letter-spacing:.5px;opacity:.5}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:22px;line-height:1.8}
.foot b{color:var(--gold-soft)}
.updated{text-align:center;color:var(--muted);font-size:10px;margin-top:8px;opacity:.6}
.refresh{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:var(--gold);border:none;color:#15120a;font-size:19px;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer}
</style></head><body>
<header><div class="wrap hrow">
<div><div class="brand">Stratford<span class="d">.</span> Agents</div><div class="sub">Control Center</div></div>
<div class="live"><span class="dot"></span>Live</div>
</div></header>
<div class="wrap">
<div class="summary" id="summary"></div>
<div class="sech"><span class="bar"></span>Agent Team</div>
<div id="agents"></div>
<div class="foot"><b>6 agents running your pipeline.</b> Tap any agent for its stats and recent activity.</div>
<div class="updated" id="updated"></div>
</div>
<button class="refresh" id="refresh">↻</button>
<script>
const DATA={sent:229,contacted:100,leads:227,replies:0,bounced:13};
const AGENTS=[
 {id:'outreach',ico:'📡',name:'Outreach Agent',role:'Cold email engine',
  task:'Sending across 6 warmed inboxes',
  stats:[['Emails sent',DATA.sent],['Contacted',DATA.contacted+' / 230'],['Bounce rate','5.7%'],['Replies',DATA.replies],['Inboxes','6 warmed']],
  log:['Pacing ~25 per inbox for deliverability','MX-validated batch, bounces minimal','Running 6-touch follow-up sequence','Scanning for replies every 30 min']},
 {id:'sourcing',ico:'🔎',name:'Sourcing Agent',role:'Finds fresh prospects',
  task:'Last pull: 150 verified leads',
  stats:[['Last batch','150 verified'],['Target cities','8'],['Dupes blocked','2,811'],['Quality','100% MX-valid']],
  log:['Sourced med-spa, dental, cosmetic','Deduped against suppression list','Handed clean batch to Outreach']},
 {id:'campaign',ico:'🎯',name:'Campaign Agent',role:'Monitors ad accounts',
  task:'Watching ad account via Meta API',
  stats:[['Meta API','Connected'],['Ad account','Active'],['Live campaigns','0'],['Function','Daily pulls + alerts']],
  log:['Reads spend, leads, CPL, CTR','Flags ads that overspend','Ready for client #1']},
 {id:'reporting',ico:'📊',name:'Reporting Agent',role:'Builds client reports',
  task:'Weekly performance snapshots',
  stats:[['Dashboard','Built'],['Cadence','Weekly'],['Source','Meta API'],['Status','Armed']],
  log:['Auto-fills the branded console','Sends clients a weekly summary','No manual work required']},
 {id:'followup',ico:'⚡',name:'Follow-Up Agent',role:'Instant lead response',
  task:'Primed for instant lead replies',
  stats:[['Response speed','1.4 sec'],['Email reply','Validated'],['Nurture','Day 0/1/3/7'],['Activates','At client #1']],
  log:['Instant auto-reply proven','Runs the nurture sequence','Keeps hot leads warm']},
 {id:'retention',ico:'🔁',name:'Retention Agent',role:'Keeps clients winning',
  task:'Monitoring results for churn risk',
  stats:[['Watches','Per-client results'],['Alerts','Early warning'],['Check-ins','Monthly'],['Priority','Retention']],
  log:['Tracks each client monthly','Flags churn risk early','Keeps relationships warm']},
];
const el=i=>document.getElementById(i);
function render(){
 el('summary').innerHTML=[['v g',AGENTS.length,'Agents'],['v g','6','Active'],['v g',DATA.sent,'Emails Sent']].map(s=>'<div class="sc"><div class="'+s[0]+'">'+s[1]+'</div><div class="l">'+s[2]+'</div></div>').join('');
 el('agents').innerHTML=AGENTS.map(a=>
  '<div class="agent" data-id="'+a.id+'"><div class="atop">'+
   '<div class="ico">'+a.ico+'</div>'+
   '<div class="ainfo"><div class="aname">'+a.name+'</div><div class="arole">'+a.role+'</div></div>'+
   '<div class="badge">Active</div></div>'+
   '<div class="atask">'+a.task+'</div>'+
   '<div class="adetail"><div class="adetail-inner">'+
     a.stats.map(s=>'<div class="stat-row"><span class="k">'+s[0]+'</span><span class="val">'+s[1]+'</span></div>').join('')+
     '<div class="log">'+a.log.map(l=>'<div class="logitem">'+l+'</div>').join('')+'</div>'+
   '</div></div>'+
   '<div class="tap">tap for details</div></div>'
 ).join('');
 document.querySelectorAll('.agent').forEach(c=>c.onclick=()=>c.classList.toggle('open'));
 const now=new Date();el('updated').textContent='Last synced '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' · data from Instantly + Meta';
}
el('refresh').onclick=()=>{const b=el('refresh');b.style.transform='rotate(360deg)';b.style.transition='transform .5s';setTimeout(()=>{b.style.transform='';b.style.transition='';},500);render();};
render();
</script></body></html>
